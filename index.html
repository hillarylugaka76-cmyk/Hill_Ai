<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hill AI — Coding & Debugging Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <style>
    :root {
      /* Brand Palette — Royal Blue & Soft Milk/Cream */
      --accent: #1d4ed8;
      --accent-hover: #1e40af;
      --accent-soft: #eff6ff;
      --accent-border: #bfdbfe;

      --bg-page: #faf9f6;
      --bg-sidebar: #f3f1ec;
      --bg-card: #ffffff;
      --bg-user-bubble: #e8effd;
      --bg-code: #0f172a;
      --bg-code-header: #1e293b;

      --text-primary: #111827;
      --text-secondary: #4b5563;
      --text-muted: #6b7280;
      --text-code: #f8fafc;

      --border-light: #e5e3dc;
      --status-online: #16a34a;
      --danger: #dc2626;

      --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 14px rgba(15, 23, 42, 0.08);
      --sidebar-width: 270px;
      --header-height: 64px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* App Layout */
    .app-shell {
      display: flex;
      height: 100dvh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      padding: 14px;
      transition: transform 0.25s ease;
      z-index: 40;
      flex-shrink: 0;
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background-color 0.15s ease;
    }

    .new-chat-btn:hover {
      background-color: var(--accent-hover);
    }

    .sidebar-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin: 18px 6px 8px;
    }

    .chat-history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chat-history-empty {
      font-size: 0.85rem;
      color: var(--text-muted);
      padding: 10px 8px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 0.88rem;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .history-item:hover {
      background-color: rgba(29, 78, 216, 0.08);
      color: var(--text-primary);
    }

    .history-item.active {
      background-color: var(--bg-card);
      color: var(--accent);
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }

    .history-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .delete-chat-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      opacity: 0.7;
      transition: color 0.15s ease, opacity 0.15s ease;
    }

    .delete-chat-btn:hover {
      color: var(--danger);
      opacity: 1;
    }

    .sidebar-footer {
      border-top: 1px solid var(--border-light);
      padding-top: 12px;
      margin-top: 10px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      z-index: 30;
    }

    .sidebar-backdrop.visible {
      display: block;
    }

    /* Main Column */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      height: 100dvh;
      position: relative;
    }

    /* Fixed Top Bar */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: var(--header-height);
      background-color: rgba(250, 249, 246, 0.94);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-btn {
      display: none;
      background: var(--bg-card);
      border: 1px solid var(--border-light);
      color: var(--text-primary);
      width: 38px;
      height: 38px;
      border-radius: 9px;
      font-size: 1rem;
      cursor: pointer;
      align-items: center;
      justify-content: center;
    }

    .brand-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--status-online);
      box-shadow: 0 0 0 2px rgba(22, 163, 74, 0.2);
    }

    /* Avatars & Fallback */
    .avatar-wrap {
      position: relative;
      border-radius: 50%;
      overflow: hidden;
      flex-shrink: 0;
      background-color: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      user-select: none;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .avatar-sm {
      width: 34px;
      height: 34px;
      font-size: 0.95rem;
    }

    .avatar-md {
      width: 42px;
      height: 42px;
      font-size: 1.15rem;
      border: 2px solid var(--accent-border);
    }

    .avatar-lg {
      width: 82px;
      height: 82px;
      font-size: 2.1rem;
      border: 3px solid var(--accent-border);
      box-shadow: var(--shadow-md);
    }

    /* Chat Scroll Area */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px 32px;
      scroll-behavior: smooth;
    }

    .chat-inner {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Welcome Screen */
    .welcome-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 28px 12px 12px;
      margin: auto 0;
    }

    .welcome-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-top: 16px;
      color: var(--text-primary);
    }

    .welcome-subtitle {
      font-size: 1rem;
      color: var(--text-secondary);
      max-width: 520px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .suggestions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 680px;
      margin-top: 28px;
    }

    .suggestion-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    .suggestion-card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    .suggestion-card-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .suggestion-card-desc {
      font-size: 0.83rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Message Rows */
    .message-row {
      display: flex;
      gap: 12px;
      width: 100%;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .message-row.assistant {
      justify-content: flex-start;
      align-items: flex-start;
    }

    .user-bubble {
      background-color: var(--bg-user-bubble);
      border: 1px solid var(--accent-border);
      color: var(--text-primary);
      padding: 12px 16px;
      border-radius: 16px 16px 4px 16px;
      max-width: 78%;
      font-size: 0.96rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .assistant-content-wrap {
      flex: 1;
      min-width: 0;
      max-width: calc(100% - 46px);
    }

    .assistant-bubble {
      background-color: var(--bg-card);
      border: 1px solid var(--border-light);
      border-radius: 4px 16px 16px 16px;
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      font-size: 0.96rem;
      line-height: 1.62;
      color: var(--text-primary);
      word-break: break-word;
    }

    .assistant-bubble.error-bubble {
      border-color: #fecaca;
      background-color: #fef2f2;
      color: #991b1b;
    }

    /* Formatted Markdown Content */
    .assistant-bubble p {
      margin-bottom: 10px;
    }

    .assistant-bubble p:last-child {
      margin-bottom: 0;
    }

    .assistant-bubble h1,
    .assistant-bubble h2,
    .assistant-bubble h3,
    .assistant-bubble h4 {
      margin: 14px 0 8px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .assistant-bubble h1:first-child,
    .assistant-bubble h2:first-child,
    .assistant-bubble h3:first-child {
      margin-top: 0;
    }

    .assistant-bubble h1 { font-size: 1.25rem; }
    .assistant-bubble h2 { font-size: 1.12rem; }
    .assistant-bubble h3 { font-size: 1.02rem; }

    .assistant-bubble ul,
    .assistant-bubble ol {
      margin: 8px 0 12px 22px;
    }

    .assistant-bubble li {
      margin-bottom: 5px;
    }

    .assistant-bubble code.inline-code {
      background-color: var(--accent-soft);
      color: var(--accent);
      border: 1px solid var(--accent-border);
      padding: 1px 6px;
      border-radius: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.87em;
    }

    /* Code Blocks */
    .code-block-wrapper {
      margin: 12px 0;
      border-radius: 10px;
      overflow: hidden;
      background-color: var(--bg-code);
      border: 1px solid #1e293b;
    }

    .code-block-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-code-header);
      color: #cbd5e1;
      padding: 7px 14px;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: lowercase;
    }

    .copy-code-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: #f1f5f9;
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background-color 0.15s ease;
    }

    .copy-code-btn:hover {
      background: rgba(255, 255, 255, 0.18);
    }

    .code-block-wrapper pre {
      padding: 14px;
      overflow-x: auto;
      margin: 0;
      color: var(--text-code);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.55;
    }

    /* Action Bar Under AI Replies */
    .message-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 6px;
      padding-left: 4px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .action-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px 6px;
      border-radius: 6px;
      font-size: 0.82rem;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .action-btn:hover {
      background-color: rgba(29, 78, 216, 0.08);
      color: var(--accent);
    }

    .action-btn.active {
      color: var(--accent);
      background-color: var(--accent-soft);
    }

    .action-btn.active-down {
      color: var(--danger);
      background-color: #fef2f2;
    }

    .msg-timestamp {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Typing Animation */
    .typing-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 2px;
    }

    .typing-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent);
      opacity: 0.4;
      animation: pulseDot 1.2s infinite ease-in-out;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes pulseDot {
      0%, 80%, 100% {
        transform: scale(0.85);
        opacity: 0.35;
      }
      40% {
        transform: scale(1.15);
        opacity: 1;
      }
    }

    /* Input Area */
    .input-section {
      background-color: var(--bg-page);
      border-top: 1px solid var(--border-light);
      padding: 12px 16px 14px;
      flex-shrink: 0;
    }

    .input-box-wrapper {
      max-width: 800px;
      margin: 0 auto;
      background-color: var(--bg-card);
      border: 1.5px solid var(--border-light);
      border-radius: 16px;
      padding: 8px 10px 8px 16px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .input-box-wrapper:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    #messageInput {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.96rem;
      line-height: 1.5;
      color: var(--text-primary);
      resize: none;
      max-height: 180px;
      padding: 6px 0;
    }

    #messageInput::placeholder {
      color: var(--text-muted);
    }

    #sendBtn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background-color: var(--accent);
      color: #ffffff;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background-color 0.15s ease, transform 0.1s ease, opacity 0.15s ease;
    }

    #sendBtn:hover:not(:disabled) {
      background-color: var(--accent-hover);
      transform: scale(1.04);
    }

    #sendBtn:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .disclaimer-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Mobile Responsive */
    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        transform: translateX(-100%);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .menu-btn {
        display: flex;
      }

      .suggestions-grid {
        grid-template-columns: 1fr;
      }

      .user-bubble {
        max-width: 88%;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Mobile Backdrop -->
    <div id="sidebarBackdrop" class="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar">
      <button id="newChatBtn" class="new-chat-btn" type="button">
        <i class="fa-solid fa-plus"></i>
        <span>New chat</span>
      </button>

      <div class="sidebar-label">Recent Chats</div>
      <div id="chatHistoryList" class="chat-history-list"></div>

      <div class="sidebar-footer">
        <span>Hillar Tech</span>
        <span>v1.0</span>
      </div>
    </aside>

    <!-- Main Area -->
    <main class="main-area">
      <!-- Fixed Top Bar -->
      <header class="top-bar">
        <div class="top-bar-left">
          <button id="menuBtn" class="menu-btn" type="button" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="brand-info">
            <div class="avatar-wrap avatar-md" data-ai-avatar></div>
            <div class="brand-text">
              <span class="brand-name">Hill AI</span>
              <span class="status-badge">
                <span class="status-dot"></span>
                Online
              </span>
            </div>
          </div>
        </div>
      </header>

      <!-- Chat Container -->
      <section id="chatContainer" class="chat-container">
        <div id="chatInner" class="chat-inner"></div>
      </section>

      <!-- Input Area -->
      <footer class="input-section">
        <form id="chatForm" class="input-box-wrapper">
          <textarea
            id="messageInput"
            rows="1"
            placeholder="Paste your code, describe a bug, or ask a programming question..."
            aria-label="Message Hill AI"
          ></textarea>
          <button id="sendBtn" type="submit" disabled aria-label="Send message">
            <i class="fa-solid fa-arrow-up"></i>
          </button>
        </form>
        <div class="disclaimer-note">Hill AI can make mistakes.</div>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
  </html>
